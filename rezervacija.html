<!DOCTYPE html>
<html lang="sr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Potvrda rezervacije — GroomingPG</title>
  <meta name="theme-color" content="#4f46e5">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>
<body class="min-h-full bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex items-center justify-center p-4 font-sans antialiased">

  <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl overflow-hidden">
    <!-- Top Banner -->
    <div class="bg-gradient-to-r from-brand-600 to-indigo-700 px-6 py-5 text-white">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-white/15 backdrop-blur flex items-center justify-center text-xl">🐾</div>
          <div>
            <div class="text-xs uppercase tracking-wider text-indigo-100 font-semibold">GroomingPG</div>
            <h1 class="text-lg font-bold leading-tight">Potvrda rezervacije</h1>
          </div>
        </div>
        <span class="text-[11px] font-semibold bg-white/15 px-3 py-1 rounded-full">Zakazano ✓</span>
      </div>
    </div>

    <!-- Booking Card Body -->
    <div id="cardBody" class="p-6 space-y-5">
      <!-- Date & Time Highlight Box -->
      <div class="bg-brand-50 dark:bg-brand-950/50 border border-brand-200 dark:border-brand-800/60 rounded-2xl p-4 text-center space-y-1">
        <div id="resDayMonth" class="text-xs font-bold uppercase tracking-wider text-brand-600 dark:text-brand-300">Srijeda, 25. novembar</div>
        <div id="resTime" class="text-2xl font-extrabold text-slate-900 dark:text-white">10:00</div>
        <div id="resService" class="text-xs text-slate-600 dark:text-slate-300 font-medium">Kupanje i šišanje</div>
      </div>

      <!-- Client & Dog Details -->
      <div class="space-y-3 text-sm">
        <div class="flex items-center justify-between gap-3 py-2 border-b border-slate-100 dark:border-slate-800">
          <span class="text-xs text-slate-500 dark:text-slate-400">Vlasnik</span>
          <span id="resOwner" class="font-bold text-slate-900 dark:text-white text-right">Ime Prezime</span>
        </div>

        <div class="flex items-center justify-between gap-3 py-2 border-b border-slate-100 dark:border-slate-800">
          <span class="text-xs text-slate-500 dark:text-slate-400">Ime psa</span>
          <span id="resDogName" class="font-bold text-slate-900 dark:text-white text-right">Pas</span>
        </div>

        <div class="flex items-center justify-between gap-3 py-2 border-b border-slate-100 dark:border-slate-800">
          <span class="text-xs text-slate-500 dark:text-slate-400">Rasa</span>
          <span id="resBreed" class="font-semibold text-slate-800 dark:text-slate-200 text-right">-</span>
        </div>

        <div class="flex items-center justify-between gap-3 py-2 border-b border-slate-100 dark:border-slate-800">
          <span class="text-xs text-slate-500 dark:text-slate-400">Tip kose / dlake</span>
          <span id="resHair" class="font-semibold text-slate-800 dark:text-slate-200 text-right">-</span>
        </div>

        <!-- Fixed Location -->
        <div class="bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700/70 rounded-2xl p-3.5 space-y-1">
          <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">📍 Lokacija salona</div>
          <div id="resLocation" class="text-xs font-bold text-slate-900 dark:text-white">F62R+XGW Podgorica, Montenegro</div>
          <a id="mapsLink" href="https://www.google.com/maps/search/?api=1&query=F62R%2BXGW+Podgorica,+Montenegro" target="_blank" class="inline-block text-[11px] font-semibold text-brand-600 dark:text-brand-400 hover:underline mt-0.5">
            Otvori na mapi →
          </a>
        </div>
      </div>

      <!-- Active Contact Buttons (069 012 911 -> +38269012911) -->
      <div class="space-y-2 pt-1">
        <div class="text-center text-[11px] text-slate-500 dark:text-slate-400 font-medium">
          Kontakt za pitanja ili izmjenu termina: <strong class="text-slate-800 dark:text-slate-200">069 012 911</strong>
        </div>
        <div class="grid grid-cols-3 gap-2.5">
          <a href="tel:+38269012911" class="flex flex-col items-center justify-center gap-1 bg-slate-900 hover:bg-slate-800 dark:bg-slate-800 dark:hover:bg-slate-700 text-white py-3 px-2 rounded-2xl transition shadow-sm">
            <span class="text-lg">📞</span>
            <span class="text-xs font-semibold">Telefon</span>
          </a>
          <a id="waBtn" href="https://wa.me/38269012911" target="_blank" class="flex flex-col items-center justify-center gap-1 bg-emerald-600 hover:bg-emerald-500 text-white py-3 px-2 rounded-2xl transition shadow-sm">
            <span class="text-lg">💬</span>
            <span class="text-xs font-semibold">WhatsApp</span>
          </a>
          <a id="viberBtn" href="viber://chat?number=%2B38269012911" class="flex flex-col items-center justify-center gap-1 bg-purple-600 hover:bg-purple-500 text-white py-3 px-2 rounded-2xl transition shadow-sm">
            <span class="text-lg">💜</span>
            <span class="text-xs font-semibold">Viber</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FIXED_LOCATION = 'F62R+XGW Podgorica, Montenegro';
    const PHONE_INTL = '38269012911';

    const DAYS_SR = ['Nedjelja', 'Ponedjeljak', 'Utorak', 'Srijeda', 'Četvrtak', 'Petak', 'Subota'];
    const MONTHS_SR = [
      'januar', 'februar', 'mart', 'april', 'maj', 'jun',
      'jul', 'avgust', 'septembar', 'oktobar', 'novembar', 'decembar'
    ];

    // Automatic daytime (white) / nighttime (dark) schedule: 06:00 - 18:00 daytime
    function applyDayNight() {
      const hour = new Date().getHours();
      const isDay = hour >= 6 && hour < 18;
      document.documentElement.classList.toggle('dark', !isDay);
    }
    applyDayNight();

    function formatSerbianDate(dateStr, dayNameParam, monthNameParam) {
      if (dayNameParam && monthNameParam && dateStr) {
        const parts = dateStr.split('-');
        const dayNum = parts.length === 3 ? parseInt(parts[2], 10) : '';
        return `${dayNameParam}, ${dayNum ? dayNum + '. ' : ''}${monthNameParam}`;
      }
      if (!dateStr) return 'Termin nije naveden';
      const d = new Date(dateStr + 'T12:00:00');
      if (isNaN(d.getTime())) return dateStr;
      const dayName = dayNameParam || DAYS_SR[d.getDay()];
      const dayNum = d.getDate();
      const monthName = monthNameParam || MONTHS_SR[d.getMonth()];
      return `${dayName}, ${dayNum}. ${monthName}`;
    }

    (function initCard() {
      const p = new URLSearchParams(window.location.search);
      const owner = p.get('vlasnik') || 'Klijent';
      const dog = p.get('pas') || 'Ljubimac';
      const breed = p.get('rasa') || 'Nije navedeno';
      const hair = p.get('dlaka') || 'Nije navedeno';
      const dateStr = p.get('datum') || new Date().toISOString().split('T')[0];
      const dayName = p.get('dan') || '';
      const monthName = p.get('mesec') || '';
      const timeStr = p.get('vreme') || '10:00';
      const service = p.get('usluga') || 'Kupanje i šišanje';
      const location = p.get('lokacija') || FIXED_LOCATION;

      document.getElementById('resDayMonth').textContent = formatSerbianDate(dateStr, dayName, monthName);
      document.getElementById('resTime').textContent = timeStr;
      document.getElementById('resService').textContent = service;
      document.getElementById('resOwner').textContent = owner;
      document.getElementById('resDogName').textContent = dog;
      document.getElementById('resBreed').textContent = breed;
      document.getElementById('resHair').textContent = hair;
      document.getElementById('resLocation').textContent = location;
      document.getElementById('mapsLink').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(location);

      const quickMsg = encodeURIComponent(`Zdravo! Imamo pitanje u vezi rezervacije za ${dog} (${formatSerbianDate(dateStr, dayName, monthName)} u ${timeStr}).`);
      document.getElementById('waBtn').href = `https://wa.me/${PHONE_INTL}?text=${quickMsg}`;
      document.getElementById('viberBtn').href = `viber://chat?number=%2B${PHONE_INTL}`;
    })();
  </script>
</body>
</html>
